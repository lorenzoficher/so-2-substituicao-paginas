# Grade de experimentos — único lugar onde ficam os valores da grade.
#
# Lido por scripts/run_grid.sh (`make grid`). Listas separadas por espaço.

# Traces, sem a extensão: cada um é lido de traces/<nome>.trace.
TRACES="bzip gcc sixpack swim bigone"

# Números de frames simulados em todas as políticas.
FRAMES="4 6 8 10 12 14 16 20 24 32 48 64 96 128 192 256 384 512"

# Pares N:I do LRU aproximado — bits de histórico : intervalo de envelhecimento.
# 8:100 é o par de referência (experimento principal); os demais formam o
# experimento de sensibilidade — N variando com I = 100, I variando com N = 8.
# Escolha e porquê em docs/adr/0002-par-de-referencia-e-grade-de-frames.md.
LRU_PAIRS="8:100 2:100 4:100 16:100 32:100 8:10 8:1000 8:10000 8:100000"
